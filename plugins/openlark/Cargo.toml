[package]
name = "steve-plugin-openlark"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Steve channel plugin: Feishu / Lark as you, through an openlark-gateway"
repository = "https://github.com/Infranite/steve-extensions"
publish = false

# The plugin builds on its own: `cargo build` in this directory.
[workspace]

[lib]
name = "steve_plugin_openlark"
path = "src/lib.rs"

[[bin]]
name = "steve-plugin-openlark"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
futures = "=0.3.34"
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
